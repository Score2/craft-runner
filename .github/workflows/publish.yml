name: Publish npm package and release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm and GitHub Releases
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[npm publish]')
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 'current'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Read package metadata
        id: package
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: npm publish --access public

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          mapfile -t AGENT_JARS < <(find agent/build/libs -maxdepth 1 -type f -name 'craft-runner-agent-*.jar' | sort)
          test "${#AGENT_JARS[@]}" -gt 0
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${AGENT_JARS[@]}" --clobber
          else
            gh release create "$TAG" "${AGENT_JARS[@]}" \
              --target "$GITHUB_SHA" \
              --title "craft-runner ${VERSION}" \
              --notes "Published npm package @score2/craft-runner@${VERSION}. Platform-specific agent jars are attached for manual server installation."
          fi
